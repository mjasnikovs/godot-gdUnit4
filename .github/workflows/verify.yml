name: verify

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          VERSION=4.7.2
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          mv Godot_v${VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          chmod +x /usr/local/bin/godot
          godot --version

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Import assets
        working-directory: godot
        run: godot --headless --import

      - name: Compile with warnings as errors
        working-directory: godot
        run: |
          # Every warning is set to error in project.godot, so any script
          # problem shows up here as output. No output means clean.
          output=$(godot --headless --quit-after 120 2>&1 | grep -v '^Godot Engine' || true)
          if [ -n "$output" ]; then
            echo "$output"
            exit 1
          fi
          echo "clean"

      - name: Run the test suites
        working-directory: godot
        run: xvfb-run -a godot -s addons/gdUnit4/bin/GdUnitCmdTool.gd -c -a res://test

      - name: Run the test suites headless
        working-directory: godot
        run: godot --headless -s addons/gdUnit4/bin/GdUnitCmdTool.gd --ignoreHeadlessMode -c -a res://test
