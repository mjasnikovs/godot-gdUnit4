name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot
        run: |
          VERSION=4.7.2
          curl -fsSL -o godot.zip \
            "https://github.com/godotengine/godot/releases/download/${VERSION}-stable/Godot_v${VERSION}-stable_linux.x86_64.zip"
          unzip -q godot.zip
          sudo mv Godot_v${VERSION}-stable_linux.x86_64 /usr/local/bin/godot
          sudo chmod +x /usr/local/bin/godot
          godot --version

      - name: Install xvfb
        run: sudo apt-get update && sudo apt-get install -y xvfb

      - name: Import assets
        working-directory: godot
        run: godot --headless --import

      - name: Compile with warnings as errors
        working-directory: godot
        run: |
          # Every warning is set to error in project.godot. --check-only parses
          # one script and exits non-zero on any of them, so every file is
          # covered. Running the main scene instead only loads what main.tscn
          # reaches, which is two of the thirteen scripts here.
          status=0
          while IFS= read -r f; do
            if out=$(godot --headless --check-only --script "$f" 2>&1); then
              echo "ok   $f"
            else
              echo "FAIL $f"
              echo "$out" | grep -v '^Godot Engine'
              status=1
            fi
          done < <(find scripts test -name '*.gd' | sort)
          exit $status

      # Both legs use run_tests.sh so the runner flags live in one place.
      - name: Run the test suites
        working-directory: godot
        run: ./run_tests.sh

      - name: Run the test suites headless
        working-directory: godot
        env:
          GDUNIT_HEADLESS: "1"
        run: ./run_tests.sh
